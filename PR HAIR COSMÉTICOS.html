<style id="estilo">

html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
a{color:inherit}

.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:500;font-size:1.25rem;letter-spacing:.18em;text-decoration:none}

dt{font-weight:500}dd{margin:0 0 14px;color:var(--muted)}

.art .b3{left:71%;width:15%;height:36%;border-radius:6px 6px 50% 50%/6px 6px 14% 14%}
.art b{position:absolute;left:16px;bottom:16px;background:var(--surface);color:var(--ink);font-weight:500;font-size:.88rem;padding:8px 14px;border-radius:999px}
.aviso{background:var(--accent);color:var(--on-accent);text-align:center;padding:9px 16px;font-size:.92rem}
.vant{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding:36px 0 8px}
.vant h3{font-weight:500;font-size:1rem;margin:0 0 4px}.vant h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:10px}

.tile{position:relative}
.tag{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:.78rem;font-weight:500;padding:3px 10px;border-radius:999px;box-shadow:0 0 0 1px var(--line)}
.busca{margin-left:auto;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-width:200px}

.passos b{font-weight:500}.passos p{color:var(--muted);margin:4px 0 0;max-width:30ch}
details{border-top:1px solid var(--line);padding:16px 0;max-width:720px}details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:500}details p{color:var(--muted);margin:10px 0 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--accent);color:var(--on-accent);padding:13px 20px;border-radius:999px;text-decoration:none;font-weight:500;box-shadow:0 10px 26px -10px rgba(0,0,0,.4)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px}
.bar span{margin-right:auto;font-weight:500}
.bar button,.ed button,.modal button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;padding:6px 14px}
.bar button.prim,.modal button.prim{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.ed{display:flex;gap:6px;margin-top:10px}.ed button{font-size:.85rem;color:var(--muted)}
.vazio{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal form{background:var(--surface);color:var(--ink);border-radius:10px;padding:24px;width:100%;max-width:440px;max-height:100%;overflow:auto}
.modal h3{margin:0 0 14px;font-weight:500}
.modal label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:12px}
.modal input,.modal textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.modal label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}.modal label.chk input{width:auto;margin:0}
.modal .row{display:flex;gap:8px;justify-content:flex-end}.err{color:#B3261E;min-height:1.2em;margin:0 0 8px}
@media(max-width:700px){.about{grid-template-columns:1fr}.hero{grid-template-columns:1fr;gap:32px}.art{aspect-ratio:4/3}.busca{margin-left:0;width:100%}nav a{margin-left:14px}.btn.ghost{margin:10px 0 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script id="app">

var ed=false,dirty=false,filtro='Todos',aviso='',busca='';
var FONTE='<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">';

function cats(){var a=[];S.produtos.forEach(function(p){if(a.indexOf(p.c)<0)a.push(p.c)});return a}
var VANT='<div class="vant"><div><h3>Produtos selecionados</h3><p>Poucos itens, bem escolhidos.</p></div><div><h3>Atendimento pessoal</h3><p>Tire dúvidas e peça indicação.</p></div><div><h3>Pedido em um toque</h3><p>A mensagem já vai pronta.</p></div><div><h3>Entrega ou retirada</h3><p>Combinadas na conversa.</p></div></div>';
var PASSOS='<section id="como"><h2>Como comprar</h2><ol class="passos"><li><b>Escolha</b><p>Veja a vitrine e separe o que combina com você.</p></li><li><b>Chame no WhatsApp</b><p>Toque em “Pedir no WhatsApp” no produto e a mensagem já vai pronta.</p></li><li><b>Combine e receba</b><p>Pagamento e entrega ou retirada são combinados direto na conversa.</p></li></ol></section>'+
'<section id="duvidas"><h2>Dúvidas frequentes</h2><details><summary>Como faço meu pedido?</summary><p>Toque em “Pedir no WhatsApp” no produto que você quer. Vamos confirmar disponibilidade e valor na conversa.</p></details><details><summary>Como funciona o pagamento?</summary><p>Combinamos a forma de pagamento direto pelo WhatsApp, depois que você escolher os produtos.</p></details><details><summary>Vocês entregam?</summary><p>Entrega ou retirada são combinadas na conversa, de acordo com a sua região.</p></details></section>';
function render(){

  '<div class="aviso">Faça seu pedido pelo WhatsApp e combine entrega ou retirada na conversa.</div><div class="wrap"><header><a class="logo" href="#">'+h(L.nome)+'</a><nav><a href="#produtos">Produtos</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a></nav></header>'+

function campo(f,v){
  if(f.t==='textarea')return'<label>'+f.l+'<textarea name="'+f.k+'" rows="3">'+h(v)+'</textarea></label>';

  return'<label>'+f.l+'<input name="'+f.k+'" type="'+f.t+'"'+(f.t==='number'?' step="0.01" min="0"':'')+(f.t==='file'?' accept="image/*"':' value="'+h(v)+'"')+(f.list?' list="cats"':'')+(f.req?' required':'')+'></label>';
}
function modal(tit,campos,v,ok){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<form><h3>'+tit+'</h3>'+campos.map(function(f){return campo(f,v[f.k])}).join('')+'<datalist id="cats">'+cats().map(function(c){return'<option value="'+h(c)+'">'}).join('')+'</datalist><p class="err" role="alert"></p><div class="row"><button type="button" data-x>Cancelar</button><button class="prim">Concluir</button></div></form>';

  var i=m.querySelector('input,textarea');if(i)i.focus();

function reduzir(f){return new Promise(function(ok,err){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):err(new Error('Imagem inválida.'))},'image/jpeg',.85)};im.onerror=function(){err(new Error('Imagem inválida.'))};im.src=r.result};r.onerror=function(){err(new Error('Não consegui ler o arquivo.'))};r.readAsDataURL(f)})}
var CP=[{k:'n',l:'Nome do produto',t:'text',req:1},{k:'d',l:'Detalhe (ex.: 300 ml)',t:'text'},{k:'p',l:'Preço (R$)',t:'number',req:1},{k:'c',l:'Categoria',t:'text',list:1,req:1},{k:'tag',l:'Selo (ex.: Novo, Mais vendido)',t:'text'},{k:'img',l:'Foto (opcional)',t:'file'},{k:'esg',l:'Marcar como esgotado',t:'check'}];
function formProduto(id){

  modal(id?'Editar produto':'Novo produto',CP,p,async function(o){

root.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;

  else if(a==='edit')formProduto(id);
  else if(a==='loja')formLoja();
  else if(a==='salvar')salvar();
  else if(a==='del'){b.dataset.a='del2';b.textContent='Confirmar exclusão'}
  else if(a==='del2'){S.produtos=S.produtos.filter(function(x){return x.id!==id});dirty=true;render()}
});
root.addEventListener('input',function(e){if(e.target.id!=='busca')return;var v=e.target.value;busca=v;render();var i=document.getElementById('busca');i.focus();i.setSelectionRange(v.length,v.length)});
render();
if(window.claude)claude.use('user').then(function(u){return u&&u.canEdit()}).then(function(v){if(v){ed=true;render()}}).catch(function(){});
</script></body></html>
